services:
  products-service:
    build:
      context: ./services/products-service
    container_name: cookie-products-service
    restart: unless-stopped
    environment:
      PORT: 4001
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-secret}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    ports:
      - "4001:4001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  upload-service:
    build:
      context: ./services/upload-service
    container_name: cookie-upload-service
    restart: unless-stopped
    environment:
      PORT: 4002
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-secret}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    ports:
      - "4002:4002"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  mail-service:
    build:
      context: ./services/mail-service
    container_name: cookie-mail-service
    restart: unless-stopped
    environment:
      PORT: 4003
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://web:3000}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4003/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      args:
        PRODUCTS_API_URL: http://products-service:4001
        MAIL_SERVICE_URL: http://mail-service:4003
        NEXT_PUBLIC_PRODUCTS_API_URL: ${NEXT_PUBLIC_PRODUCTS_API_URL:-http://localhost:4001}
        NEXT_PUBLIC_UPLOAD_API_URL: ${NEXT_PUBLIC_UPLOAD_API_URL:-http://localhost:4002}
    container_name: cookie-web
    restart: unless-stopped
    environment:
      PRODUCTS_API_URL: http://products-service:4001
      MAIL_SERVICE_URL: http://mail-service:4003
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      DISCORD_ORDER_WEBHOOK_URL: ${DISCORD_ORDER_WEBHOOK_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.8-flash}
      NEXT_PUBLIC_PRODUCTS_API_URL: ${NEXT_PUBLIC_PRODUCTS_API_URL:-http://localhost:4001}
      NEXT_PUBLIC_UPLOAD_API_URL: ${NEXT_PUBLIC_UPLOAD_API_URL:-http://localhost:4002}
    depends_on:
      products-service:
        condition: service_healthy
      upload-service:
        condition: service_healthy
      mail-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-proxy:
    image: nginx:1.27-alpine
    container_name: cookie-web-proxy
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./monitoring/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3
    container_name: cookie-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://web-proxy/nginx_status
    depends_on:
      - web-proxy

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: cookie-blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cookie-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - products-service
      - upload-service
      - mail-service
      - nginx-exporter
      - blackbox-exporter

  grafana:
    image: grafana/grafana:11.2.0
    container_name: cookie-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
